name: Manual QA

on:
  workflow_dispatch:
    inputs:
      qa_level:
        description: QA tier for an intentional retry
        type: choice
        default: targeted
        options: [none, targeted, full]
      group:
        description: Optional single QA group to retry
        type: string
        default: ''
      test_file:
        description: Optional single test file to retry
        type: string
        default: ''
      base:
        description: Optional comparison commit
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.qa.outputs.level }}
      groups: ${{ steps.qa.outputs.groups }}
      needs_dependencies: ${{ steps.qa.outputs.needs_dependencies }}
      needs_electron: ${{ steps.qa.outputs.needs_electron }}
      needs_tools: ${{ steps.qa.outputs.needs_tools }}
      base: ${{ steps.base.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Choose comparison commit
        id: base
        shell: pwsh
        env:
          MANUAL_BASE: ${{ inputs.base }}
        run: |
          $base = if ($env:MANUAL_BASE) { $env:MANUAL_BASE } else { 'HEAD^' }
          "value=$base" >> $env:GITHUB_OUTPUT
      - name: Make one QA plan
        id: qa
        shell: pwsh
        env:
          QA_LEVEL: ${{ inputs.qa_level }}
          QA_GROUP: ${{ inputs.group }}
          QA_TEST_FILE: ${{ inputs.test_file }}
          QA_BASE: ${{ steps.base.outputs.value }}
        run: |
          $arguments = @('scripts/qa-plan.js', '--github-output', $env:GITHUB_OUTPUT)
          if ($env:QA_TEST_FILE) {
            $arguments += @('--test-file', $env:QA_TEST_FILE)
          } elseif ($env:QA_GROUP) {
            $arguments += @('--group', $env:QA_GROUP)
          } else {
            $arguments += @('--base', $env:QA_BASE, '--level', $env:QA_LEVEL)
          }
          node @arguments

  verify:
    needs: plan
    if: needs.plan.outputs.level != 'none'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies once
        if: needs.plan.outputs.needs_dependencies == 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Restore locked Electron archive only for full QA
        if: needs.plan.outputs.needs_electron == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'dependency-lock.json') }}
      - name: Prepare Electron only when selected QA needs it
        if: needs.plan.outputs.needs_electron == 'true'
        env:
          electron_config_cache: ${{ runner.temp }}\electron-cache
        run: npm run electron:prepare -- --allow-download
      - name: Restore locked bundled tools
        id: tools_cache
        if: needs.plan.outputs.needs_tools == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            tools\7zip
            tools\ffmpeg
          key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependency-lock.json') }}
      - name: Prepare bundled tools only when selected QA needs them
        if: needs.plan.outputs.needs_tools == 'true' && steps.tools_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $bootstrap = "${env:ProgramFiles}\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force tools\7zip | Out-Null
          Copy-Item -LiteralPath $bootstrap -Destination tools\7zip\7z.exe
          npm run tools:prepare
      - name: Run the selected QA only
        shell: pwsh
        env:
          QA_LEVEL: ${{ needs.plan.outputs.level }}
          QA_GROUP: ${{ inputs.group }}
          QA_TEST_FILE: ${{ inputs.test_file }}
          QA_BASE: ${{ needs.plan.outputs.base }}
        run: |
          $arguments = @('scripts/qa-plan.js', '--execute')
          if ($env:QA_TEST_FILE) { $arguments += @('--test-file', $env:QA_TEST_FILE) }
          elseif ($env:QA_GROUP) { $arguments += @('--group', $env:QA_GROUP) }
          else { $arguments += @('--base', $env:QA_BASE, '--level', $env:QA_LEVEL) }
          node @arguments
      - name: Run the complete release gates only for explicit full QA
        if: needs.plan.outputs.level == 'full'
        run: npm run publish:check && npm run verify:tools
