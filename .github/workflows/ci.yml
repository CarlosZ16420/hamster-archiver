name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare locked bundled tools
        shell: pwsh
        run: |
          $bootstrap = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $bootstrap)) { throw 'GitHub runner is missing the 7-Zip bootstrap executable.' }
          New-Item -ItemType Directory -Force tools\7zip | Out-Null
          Copy-Item -LiteralPath $bootstrap -Destination tools\7zip\7z.exe
          npm run tools:prepare
      - run: npm run verify:dependencies
      - run: npm run verify:tools
      - run: npm run check
      - run: npm test
      - run: npm run publish:check
