name: Package Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare locked bundled tools
        shell: pwsh
        run: |
          $bootstrap = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $bootstrap)) { throw "GitHub runner is missing 7-Zip." }
          New-Item -ItemType Directory -Force tools\7zip | Out-Null
          Copy-Item -LiteralPath $bootstrap -Destination tools\7zip\7z.exe
          npm run tools:prepare
      - name: Build, verify and package
        run: npm run release:local
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HamsterArchiver-${{ github.ref_name }}-windows-x64
          path: ../HamsterArchiver-Local/builds/packages/*
          if-no-files-found: error
