name: Package Windows release
run-name: Windows release ${{ inputs.tag }} / ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (main allowed only for validation)
        required: true
        default: main
        type: string
      publish:
        description: Build, verify, upload and publish the complete Release
        default: false
        type: boolean
      retain_artifact:
        description: Also retain a temporary Actions package for 3 days
        default: false
        type: boolean
      request_id:
        description: Unique identifier used by the release launcher
        default: manual
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PROMPT_DISABLED: '1'
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Set isolated build directory
        shell: pwsh
        run: '"HAMSTER_LOCAL_ROOT=$env:RUNNER_TEMP\HamsterArchiver-Local" >> $env:GITHUB_ENV'
      - name: Inspect Release state before building
        id: release_state
        if: inputs.publish
        shell: pwsh
        run: |
          $state = node scripts/release-publish.js state --repo $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "value=$state" >> $env:GITHUB_OUTPUT
      - name: Publish an already complete draft without rebuilding
        if: inputs.publish && steps.release_state.outputs.value == 'complete-draft'
        run: node scripts/release-publish.js publish --repo $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG
      - name: Report an already published complete Release
        if: inputs.publish && steps.release_state.outputs.value == 'complete-published'
        shell: pwsh
        run: "'The requested GitHub Release was already published and complete; no rebuild or upload was needed.' >> $env:GITHUB_STEP_SUMMARY"
      - if: ${{ !inputs.publish || steps.release_state.outputs.value == 'missing' || steps.release_state.outputs.value == 'partial-draft' }}
        run: npm ci
      - name: Install locked Electron runtime
        if: ${{ !inputs.publish || steps.release_state.outputs.value == 'missing' || steps.release_state.outputs.value == 'partial-draft' }}
        run: node node_modules/electron/install.js
      - name: Prepare locked bundled tools
        if: ${{ !inputs.publish || steps.release_state.outputs.value == 'missing' || steps.release_state.outputs.value == 'partial-draft' }}
        shell: pwsh
        run: |
          $bootstrap = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $bootstrap)) { throw "GitHub runner is missing 7-Zip." }
          New-Item -ItemType Directory -Force tools\7zip | Out-Null
          Copy-Item -LiteralPath $bootstrap -Destination tools\7zip\7z.exe
          npm run tools:prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build complete local release with full checks
        if: ${{ !inputs.publish || steps.release_state.outputs.value == 'missing' || steps.release_state.outputs.value == 'partial-draft' }}
        run: npm run release:local -- --full-checks
      - name: Verify complete release files
        if: ${{ !inputs.publish || steps.release_state.outputs.value == 'missing' || steps.release_state.outputs.value == 'partial-draft' }}
        run: node scripts/release-publish.js verify
      - name: Create or resume and publish verified GitHub Release
        if: inputs.publish && (steps.release_state.outputs.value == 'missing' || steps.release_state.outputs.value == 'partial-draft')
        shell: pwsh
        run: node scripts/release-publish.js release --repo $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG
      - name: Optionally retain temporary package
        if: inputs.retain_artifact && (!inputs.publish || steps.release_state.outputs.value == 'missing' || steps.release_state.outputs.value == 'partial-draft')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HamsterArchiver-${{ inputs.tag }}-windows-x64
          path: |
            ${{ runner.temp }}\HamsterArchiver-Local\builds\packages\*.zip*
            ${{ runner.temp }}\HamsterArchiver-Local\builds\installers\*.exe*
          retention-days: 3
          if-no-files-found: error
      - name: Report failure and local fallback
        if: failure()
        shell: pwsh
        run: |
          'Cloud release workflow failed. Inspect the remote Release state first: a complete published Release needs no fallback, and a complete draft can be published directly. Use local mode only after this run has stopped and only when the cloud build or upload genuinely did not complete. Published releases are never overwritten.' >> $env:GITHUB_STEP_SUMMARY
