name: Package Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install locked Electron runtime
        run: node node_modules/electron/install.js
      - name: Prepare locked bundled tools
        shell: pwsh
        run: |
          $bootstrap = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $bootstrap)) { throw "GitHub runner is missing 7-Zip." }
          New-Item -ItemType Directory -Force tools\7zip | Out-Null
          Copy-Item -LiteralPath $bootstrap -Destination tools\7zip\7z.exe
          npm run tools:prepare
      - name: Build, verify and package
        run: npm run release:local
        env:
          HAMSTER_LOCAL_ROOT: ${{ runner.temp }}\HamsterArchiver-Local
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HamsterArchiver-${{ github.ref_name }}-windows-x64
          path: ${{ runner.temp }}\HamsterArchiver-Local\builds\packages\*
          if-no-files-found: error
