version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Version upgrades are requested and accepted as ordinary tasks.
    # Security update PRs remain enabled separately in repository settings.
    open-pull-requests-limit: 0
    versioning-strategy: increase
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
